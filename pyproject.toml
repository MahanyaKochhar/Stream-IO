[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "referral-intake-agent"
version = "0.1.0"
description = "LangGraph workflow for receiving-provider referral intake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.16,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2.11,<2",
    "llama-cloud>=2.8,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/referral_intake"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
